# =============================================================================
# nginx-strangler — Configuration de routage "as-code"
#
# Ce fichier est le cœur du pattern Strangler Fig.
# Il route progressivement les routes de server (legacy) vers server-nestjs.
#
# Variables d'environnement substituées au démarrage (via envsubst) :
#   LEGACY_UPSTREAM  — adresse du backend Fastify legacy  (ex: server:8080)
#   NESTJS_UPSTREAM  — adresse du backend NestJS          (ex: server-nestjs:3001)
#
# Format d'une bascule :
#   # [Vague X - module] AAAA-MM-JJ
#   location [= | ^~ | ~] /api/v1/xxx {
#       proxy_pass http://server-nestjs;
#       include /etc/nginx/conf.d/_proxy_headers.conf;
#   }
#
# Aucun trafic applicatif vers server-legacy : fallback API vers NestJS.
# Rollback explicite : remplacer proxy_pass par http://server-legacy dans
# le bloc concerné, valider avec nginx -t puis recharger (voir README.md).
# =============================================================================

upstream server-legacy {
    server ${LEGACY_UPSTREAM};
}

upstream server-nestjs {
    server ${NESTJS_UPSTREAM};
}

server {
    listen 8080;

    # Taille des headers (nécessaire pour les tokens Keycloak)
    large_client_header_buffers 4 32k;

    # Healthcheck de nginx-strangler lui-même
    location = /health {
      access_log off;
      add_header 'Content-Type' 'application/json';
      return 200 '{"status":"UP"}';
    }

    # ── Swagger UI ────────────────────────────────────────────────────────────────
    location /swagger-ui-server-nestjs {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Routes migrées vers NestJS ────────────────────────────────────────────────
    location /api/v1/admin/roles {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/v1/users {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/v1/projects-bulk {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Préfixe projets : toutes les sous-routes sont prises en charge par NestJS.
    location ^~ /api/v1/projects {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/v1/zones {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/v1/service-chains {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/projects/[^/]+/deployments(.*)$ {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/v1/logs {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/v1/system/plugins {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Les routes /api/v2 n'existent que sur server-nestjs
    location /api/v2/ {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /api/v1/healthz {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /api/v1/version {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/v1/stages {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /api/v1/health-services {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /api/v1/complete-services {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /api/v1/refresh-services {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Routes migrées vers NestJS — user tokens ─────────────────────────────────
    location /api/v1/user/tokens {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Routes migrées vers NestJS — clusters ─────────────────────────────────
    location /api/v1/clusters {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Routes migrées vers NestJS — system settings ─────────────────────────────────
    location /api/v1/system/settings {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Routes migrées vers NestJS — admin tokens ─────────────────────────────────
    location /api/v1/admin/tokens {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # /api sans chemin ne désigne aucune ressource ; ne pas rediriger implicitement.
    location = /api {
        return 404;
    }

    # ── Fallback API : NestJS répond aussi aux chemins inconnus (404) ─────────────
    location /api/ {
        proxy_pass         http://server-nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_buffering    off;
        proxy_redirect     off;
    }

}
