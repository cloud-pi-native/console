services:
  postgres:
    restart: unless-stopped
    image: docker.io/postgres:15.3
    container_name: dso-console_postgres
    environment:
      POSTGRES_DB: dso-console-db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d dso-console-db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 5432:5432
    volumes:
      - dso-postgres-data-integ:/var/lib/postgresql/data
    networks:
      - dso-network
    attach: false

  pgadmin:
    restart: unless-stopped
    image: docker.io/dpage/pgadmin4:latest
    container_name: dso-console_pgadmin
    depends_on:
      postgres:
        condition: service_started
    volumes:
      - ../pgadmin/servers-docker.json:/pgadmin4/servers.json
      - dso-pgadmin-data-integ:/var/lib/pgadmin
    ports:
      - 8081:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dso.fr
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - dso-network
    attach: false

  server:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: dev
    image: dso-console/server:integ
    container_name: dso-console_server
    command: [dev]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 4001:8080
      - 9229:9229
    volumes:
      - ${KUBECONFIG_HOST_PATH}:${KUBECONFIG_PATH:-/home/node/.kube/config}
      - ${EXTERNAL_PLUGINS_DIR_HOST_PATH}:/plugins
    env_file:
      - ../apps/server/.env.docker
      - ../apps/server/.env.integ
    develop:
      watch:
        - action: sync
          path: ../apps/server
          target: /app/apps/server
          ignore:
            - node_modules/
            - .env
            - .env.docker
            - .env.integ
        - action: sync
          path: ../packages/shared
          target: /app/packages/shared
          ignore:
            - node_modules/
        - action: sync
          path: ../packages/hooks
          target: /app/packages/hooks
          ignore:
            - node_modules/
        - action: sync
          path: ../plugins
          target: /app/plugins
          ignore:
            - node_modules/
        - action: rebuild
          path: ../apps/server/package.json
    networks:
      - dso-network
    attach: true

  server-nestjs:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: apps/server-nestjs/Dockerfile
      target: dev
    image: dso-console/server-nestjs:integ
    container_name: dso-console_server-nestjs
    command: [start:dev]
    depends_on:
      postgres:
        condition: service_healthy
      opencds-mockoon:
        condition: service_healthy
    ports:
      - 3001:3001
    volumes:
      - ${KUBECONFIG_HOST_PATH}:${KUBECONFIG_PATH:-/home/node/.kube/config}
      - ${EXTERNAL_PLUGINS_DIR_HOST_PATH}:/plugins
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      SERVER_HOST: ${NESTJS_SERVER_HOST:?NESTJS_SERVER_HOST is required}
      SERVER_PORT: ${NESTJS_SERVER_PORT:?NESTJS_SERVER_PORT is required}
      DB_URL: ${DB_URL:?DB_URL is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      KEYCLOAK_PROTOCOL: ${NESTJS_KEYCLOAK_PROTOCOL:?NESTJS_KEYCLOAK_PROTOCOL is required}
      KEYCLOAK_DOMAIN: ${NESTJS_KEYCLOAK_DOMAIN:?NESTJS_KEYCLOAK_DOMAIN is required}
      KEYCLOAK_REALM: ${NESTJS_KEYCLOAK_REALM:?NESTJS_KEYCLOAK_REALM is required}
      KEYCLOAK_CLIENT_ID: ${NESTJS_KEYCLOAK_CLIENT_ID:?NESTJS_KEYCLOAK_CLIENT_ID is required}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET is required}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KEYCLOAK_REDIRECT_URI: ${NESTJS_KEYCLOAK_REDIRECT_URI:?NESTJS_KEYCLOAK_REDIRECT_URI is required}
      CONTACT_EMAIL: ${NESTJS_CONTACT_EMAIL:?NESTJS_CONTACT_EMAIL is required}
      USE_SERVICE_CHAIN: ${NESTJS_USE_SERVICE_CHAIN:-false}
      OPENCDS_URL: ${NESTJS_OPENCDS_URL:-}
      OPENCDS_INTERNAL_URL: ${NESTJS_OPENCDS_INTERNAL_URL:-}
      OPENCDS_API_TOKEN: ${OPENCDS_API_TOKEN:?OPENCDS_API_TOKEN is required}
      OPENCDS_API_TLS_REJECT_UNAUTHORIZED: ${NESTJS_OPENCDS_API_TLS_REJECT_UNAUTHORIZED:-true}
    develop:
      watch:
        - action: sync
          path: ../apps/server-nestjs
          target: /app/apps/server-nestjs
          ignore:
            - node_modules/
            - .env
            - .env.docker
            - .env.integ
            - dist/
        - action: sync
          path: ../packages/shared
          target: /app/packages/shared
          ignore:
            - node_modules/
        - action: sync
          path: ../packages/hooks
          target: /app/packages/hooks
          ignore:
            - node_modules/
        - action: sync
          path: ../plugins
          target: /app/plugins
          ignore:
            - node_modules/
        - action: rebuild
          path: ../apps/server-nestjs/package.json
    networks:
      - dso-network
    attach: true

  nginx-strangler:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: apps/nginx-strangler/Dockerfile
    image: dso-console/nginx-strangler:integ
    container_name: dso-console_nginx-strangler
    depends_on:
      server:
        condition: service_started
      server-nestjs:
        condition: service_healthy
    ports:
      - 4000:8080
    environment:
      LEGACY_UPSTREAM: "server:8080"
      NESTJS_UPSTREAM: "server-nestjs:3001"
    networks:
      - dso-network
    attach: false

  client:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: apps/client/Dockerfile
      target: dev
    image: dso-console/client:integ
    container_name: dso-console_client
    depends_on:
      nginx-strangler:
        condition: service_started
    ports:
      - 8080:8080
    environment:
      SERVER_HOST: ${CLIENT_SERVER_HOST:?CLIENT_SERVER_HOST is required}
      SERVER_PORT: ${CLIENT_SERVER_PORT:?CLIENT_SERVER_PORT is required}
      CLIENT_PORT: ${CLIENT_PORT:-8080}
      KEYCLOAK_PROTOCOL: ${CLIENT_KEYCLOAK_PROTOCOL:?CLIENT_KEYCLOAK_PROTOCOL is required}
      KEYCLOAK_DOMAIN: ${CLIENT_KEYCLOAK_DOMAIN:?CLIENT_KEYCLOAK_DOMAIN is required}
      KEYCLOAK_REALM: ${CLIENT_KEYCLOAK_REALM:?CLIENT_KEYCLOAK_REALM is required}
      KEYCLOAK_CLIENT_ID: ${CLIENT_KEYCLOAK_CLIENT_ID:?CLIENT_KEYCLOAK_CLIENT_ID is required}
      KEYCLOAK_REDIRECT_URI: ${CLIENT_KEYCLOAK_REDIRECT_URI:?CLIENT_KEYCLOAK_REDIRECT_URI is required}
      OPENCDS_ENABLED: ${CLIENT_OPENCDS_ENABLED:-false}
      CONTACT_EMAIL: ${CLIENT_CONTACT_EMAIL:?CLIENT_CONTACT_EMAIL is required}
    develop:
      watch:
        - action: sync
          path: ../apps/client
          target: /app/apps/client
          ignore:
            - node_modules/
            - .env
            - .env.docker
            - .env.integ
        - action: sync
          path: ../packages/shared
          target: /app/packages/shared
          ignore:
            - node_modules/
        - action: rebuild
          path: ../apps/client/package.json
    networks:
      - dso-network
    attach: true

  opencds-mockoon:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: packages/opencds/Dockerfile
    image: dso-console/opencds-mockoon:integ
    container_name: dso-console_opencds-mockoon
    user: root
    ports:
      - 3100:3100
    networks:
      - dso-network

networks:
  dso-network:
    driver: bridge

volumes:
  dso-pgadmin-data-integ:
  dso-postgres-data-integ:
