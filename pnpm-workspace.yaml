packages:
  - packages/**
  - plugins/**
  - apps/**
  - "!apps/server/src/plugins/external/**"
  - playwright/**
allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": true
  esbuild: true
  msw: true
  prisma: true
  protobufjs: true
  vue-demi: true
allowUnusedPatches: true
autoInstallPeers: true
injectWorkspacePackages: true
# minimum number of minutes that must pass after a version is published before
# pnpm will install it. This applies to all dependencies, including transitive ones.
minimumReleaseAge: 1440 # 1 day
catalogMode: strict
cleanupUnusedCatalogs: true
shellEmulator: true
trustPolicy: no-downgrade
overrides:
  "@grpc/grpc-js@1.14.3": ">=1.14.4 <2"
  "@opentelemetry/core@2.5.1": ">=2.8.0 <3"
  "@opentelemetry/core@2.6.0": ">=2.8.0 <3"
  "@opentelemetry/core@2.7.1": ">=2.8.0 <3"
  "@opentelemetry/exporter-prometheus@0.212.0": ">=0.217.0 <1"
  "@opentelemetry/propagator-jaeger@2.5.1": ">=2.9.0 <3"
  "@opentelemetry/propagator-jaeger@2.7.1": ">=2.9.0 <3"
  "ajv@8.17.1": ">=8.18.0 <9"
  "brace-expansion@1.1.12": ">=1.1.17 <2"
  "brace-expansion@2.1.1": ">=2.1.3 <3"
  "brace-expansion@5.0.6": ">=5.0.7 <6"
  "defu@6.1.4": ">=6.1.5 <7"
  "deepmerge-ts@7.1.5": ">=8.0.2 <9"
  "dompurify@3.3.2": ">=3.4.12 <4"
  "effect@3.18.4": ">=3.20.0 <4"
  "fast-uri@3.1.2": ">=3.1.5 <4"
  "file-type@21.3.0": ">=21.3.2 <22"
  "find-my-way@9.6.0": ">=9.7.0 <10"
  "lodash@4.17.23": ">=4.18.1 <5"
  "multer@2.1.1": ">=2.2.0 <3"
  "path-to-regexp@8.3.0": ">=8.4.2 <9"
  "picomatch@4.0.2": ">=4.0.4 <5"
  "postcss@8.5.15": ">=8.5.18 <9"
  "protobufjs@7.6.4": ">=7.6.5 <8"
  "protobufjs@8.0.0": ">=8.6.6 <9"
  "protobufjs@8.0.1": ">=8.6.6 <9"
  "nanoid@3.3.17": ">=3.3.18 <4"
  "vite@8.0.11": ">=8.0.16 <9"
  "js-yaml": ">=4.3.1 <5"
  "@fastify/static@9.1.3": ">=10.1.2 <11"
  "esbuild@0.27.3": ">=0.28.1 <1"
  "fast-jwt@5.0.6": ">=6.2.4 <7"
  "serialize-javascript@6.0.2": ">=7.0.5 <8"
  "uuid@8.3.2": ">=11.1.1 <12"
  "uuid@9.0.1": ">=11.1.1 <12"
# Check these after each update. This list should be empty !
trustPolicyExclude:
  - rollup@2.80.0
  - semver@6.3.1
  - chokidar@4.0.3
  - pino@9.14.0
  - typescript-transform-paths@3.5.6
  - undici-types@6.21.0
