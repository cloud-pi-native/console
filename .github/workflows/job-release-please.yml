name: Next Prerelease and Release

permissions:
  issues: write
  contents: write
  pull-requests: write

on:
  workflow_call:

    outputs:

      release-created:
        description: Has a new release been created ?
        value: ${{ jobs.prepare.outputs.releases-created && !contains(jobs.prepare.outputs.tag-name, 'rc') }}
      prerelease-created:
        description: Is the new release a prerelease ?
        value: ${{ jobs.prepare.outputs.releases-created && contains(jobs.prepare.outputs.tag-name, 'rc') }}

      # Complete prerelease tag (e.g: `X.Y.Z-rc.A`) or release (e.g: `X.Y.Z`)
      tag-name:
        description: Version tag
        value: ${{ jobs.prepare.outputs.tag-name }}
      # For instance X.Y.Z-rc.A -> X
      major-tag:
        description: Major version tag
        value: ${{ jobs.prepare.outputs.major-tag }}
      # For instance X.Y.Z-rc.A -> Y
      minor-tag:
        description: Minor version tag
        value: ${{ jobs.prepare.outputs.minor-tag }}
      # For instance X.Y.Z-rc.A -> Z
      patch-tag:
        description: Patch version tag
        value: ${{ jobs.prepare.outputs.patch-tag }}

jobs:

  # This job ensure the necessary labels for release-please exist.
  # https://github.com/googleapis/release-please-action/issues/1074
  label-check:
    name: Create release-please PR labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add labels to the repository if not present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "autorelease: pending" -c FBCA04 -d "release-please PR tagging - Pending release" || true
          gh label create "autorelease: tagged" -c D4C5F9 -d "release-please PR tagging - Ready for release" || true
          gh label create "autorelease: snapshot" -c D4C5F9 -d "release-please PR tagging - Ready for release" || true
          gh label create "autorelease: published" -c 0E8A16 -d "release-please PR tagging - Released" || true

  # This job handles (thus the `prepare` name) a prerelease/release MR,
  # and provides the necessary outputs for the two subsequent jobs.
  # It will either:
  # - Upsert a prerelease MR after a commit has been added to the target branch (namely, `main`)
  # - Create a prerelease (`X.Y.Z-rc`, `X.Y.Z-rc.1`, `X.Y.Z-rc.2`, etc.), if this workflow has been triggered by the related MR merge
  # - Create a release (`X.Y.Z`), if this workflow has been triggered by the related MR merge
  # - In both cases "Create" means:
  #   - Updating the CHANGLOG accordingly (with the related commits)
  #   - Updating the apps package.json versions
  #   - Generating and push the git tag
  #   - Creating the related GitHub Release
  prepare:
    name: Handle prerelease/release MR
    runs-on: ubuntu-latest
    needs: [ label-check ]
    outputs:
      releases-created: ${{ steps.release.outputs.releases_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      major-tag: ${{ steps.release.outputs.major }}
      minor-tag: ${{ steps.release.outputs.minor }}
      patch-tag: ${{ steps.release.outputs.patch }}
    steps:
      - id: release
        name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: ".github/prerelease-please-config.json"
          manifest-file: ".github/prerelease-please-manifest.json"

  # This job only runs when a prerelease has just been created and thus,
  # will create/updade a subsequent "stable" release MR with the changelog incorporating the prereleases
  prerelease-post-creation-steps:
    name: Prerelease post creation steps
    runs-on: ubuntu-latest
    needs: [ label-check, prepare ]
    if: ${{ needs.prepare.outputs.releases-created == 'true' && contains(needs.prepare.outputs.tag-name, 'rc') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create next release merge request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: next-release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # This job only runs when a release has just been created and thus,
  # will create/updade the intermediary git tags (`vX` and `vX.Y`) that tracks the latest release (`vX.Y.Z`).
  release-post-creation-steps:
    name: Steps triggered after a new stable release creation
    runs-on: ubuntu-latest
    needs: [ label-check, prepare ]
    if: ${{ needs.prepare.outputs.releases-created == 'true' && !contains(needs.prepare.outputs.tag-name, 'rc') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upsert major and minor git tags to reference latest release
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add gh-token "https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git tag -d v${{ needs.prepare.outputs.major-tag }} || true
          git tag -d v${{ needs.prepare.outputs.major-tag }}.${{ needs.prepare.outputs.minor-tag }} || true
          git push origin :v${{ needs.prepare.outputs.major-tag }} || true
          git push origin :v${{ needs.prepare.outputs.major-tag }}.${{ needs.prepare.outputs.minor-tag }} || true
          git tag -a v${{ needs.prepare.outputs.major-tag }} -m "Release v${{ needs.prepare.outputs.major-tag }}"
          git tag -a v${{ needs.prepare.outputs.major-tag }}.${{ needs.prepare.outputs.minor-tag }} -m "Release v${{ needs.prepare.outputs.major-tag }}.${{ needs.prepare.outputs.minor-tag }}"
          git push origin v${{ needs.prepare.outputs.major-tag }}
          git push origin v${{ needs.prepare.outputs.major-tag }}.${{ needs.prepare.outputs.minor-tag }}
