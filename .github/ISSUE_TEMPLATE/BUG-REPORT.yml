name: 🐛 Rapport de bug
description: Signaler un comportement qui ne correspond pas à ce qui est attendu.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Décrivez le comportement constaté.
      placeholder: Le produit a...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      description: Décrivez les étapes permettant de constater le problème.
      value: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Comportement attendu
      description: Décrivez ce qui devait se produire et indiquez la documentation ou toute autre référence pertinente.
      placeholder: Selon https://..., le produit devrait...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs ou journal
      description: Ajoutez les logs, captures, liens ou tout autre élément utile si vous en avez.
      placeholder: Log, capture ou lien...
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Indiquez la version, le navigateur ou l'environnement concerné si utile.
      placeholder: Version, navigateur, environnement...
    validations:
      required: false
