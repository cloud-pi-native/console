name: 🐛 Rapport de bug
description: Signaler un comportement qui ne correspond pas à ce qui est attendu.
title: "🐛 [BUG] - <title>"
labels: [bug]
body:
  - type: textarea
    id: expected_behavior
    attributes:
      label: Comportement attendu
      description: Décrivez ce qui devait se produire et indiquez la documentation ou toute autre référence pertinente.
      placeholder: Selon https://..., le produit devrait...
    validations:
      required: true

  - type: textarea
    id: observed_behavior
    attributes:
      label: Comportement observé
      description: Décrivez ce qui s'est effectivement produit.
      placeholder: Le produit a...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      description: Décrivez les étapes permettant de constater le problème.
      value: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: impact_environment
    attributes:
      label: Impact et environnement
      description: Indiquez les personnes ou services impactés, ainsi que l'environnement concerné.
      placeholder: Version, navigateur, environnement, fréquence, impact...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Éléments de preuve
      description: Ajoutez des captures, logs, liens ou tout autre élément utile si vous en avez.
      placeholder: Capture, log ou lien...
    validations:
      required: false
