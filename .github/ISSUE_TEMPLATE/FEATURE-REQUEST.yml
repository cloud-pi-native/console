name: 💡 Demande externe
description: Proposer une évolution à l’équipe de maintenance.
labels: [user request]
body:
  - type: textarea
    id: need
    attributes:
      label: Besoin
      description: Expliquez le besoin. Le dépôt de cette demande n'implique ni acceptation ni engagement de l'équipe.
      placeholder: Quel problème souhaitez-vous résoudre ?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexte
      description: Décrivez dans quelle situation le besoin se présente et pour quels utilisateurs ou équipes.
      placeholder: Lors de ..., les utilisateurs ... ont besoin de ...
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Valeur attendue
      description: Indiquez le bénéfice attendu si cette demande était retenue.
      placeholder: Quel résultat ou impact attendez-vous ?
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Exemples et références
      description: Ajoutez des exemples, liens ou documents utiles si vous en avez.
      placeholder: https://...
    validations:
      required: false
